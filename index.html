<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title id="pageTitle">[MÃ ĐƠN HÀNG]</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f9f9f9; }
    .invoice { 
      width: 100%; 
      max-width: 800px; 
      margin: 10px auto; 
      padding: 15px; 
      background: white; 
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      font-size: 32px;
      font-weight: bold;
      margin-bottom: 15px;
      color: #333;
    }
    .info p { margin: 6px 0; font-size: 20px; }
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 15px 0;
      font-size: 19px;
      border: 2px solid #000;
    }
    th, td {
      padding: 8px;
      border: 1px solid #000;
      text-align: center;
    }
    th { background-color: #f0f0f0; font-weight: bold; }
    #invoiceTable td:nth-child(1) { text-align: left; padding-left: 8px; }
    #invoiceTable td:not(:nth-child(1)) { text-align: right; padding-right: 8px; }

    .button-container {
      margin: 20px auto;
      text-align: center;
      max-width: 800px;
    }
    button {
      font-size: 20px;
      padding: 12px 25px;
      margin: 8px;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    #shareBtn { background-color: #673ab7; }
    #sharePdfBtn { background-color: #e91e63; }
    #savePdfBtn { background-color: #4caf50; }
  </style>
</head>
<body>
  <div class="invoice" id="invoiceContent">
    <div class="header">HOÁ ĐƠN</div>
    <div class="info">
      <p id="tenKhach">Khách hàng: [KHÁCH HÀNG]</p>
      <p id="ngayBan">Ngày bán: [Ngày bán]</p>
      <p id="ghiChu">Ghi chú: [GHI CHÚ]</p>
    </div>
    <table id="invoiceTable">
      <tr>
        <th>SẢN PHẨM</th>
        <th>SL</th>
        <th>Đ.GIÁ</th>
        <th id="ckHeader">CK</th>
        <th>T.TIỀN</th>
      </tr>
    </table>
  </div>

  <div class="button-container">
    <button id="shareBtn">📤 Chia sẻ (PNG)</button>
    <button id="sharePdfBtn">📄 Chia sẻ PDF</button>
    <button id="savePdfBtn">💾 Lưu PDF</button>
  </div>

  <!-- Thư viện cần thiết -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <script>
    // ==================== LẤY DỮ LIỆU TỪ URL ====================
    const urlParams = new URLSearchParams(window.location.search);
    
    const maDonHang = urlParams.get('madonhang') || '[MÃ ĐƠN HÀNG]';
    const tenKhach = urlParams.get('khachhang') || '';
    const sauCK = urlParams.get('sauck') || '0';
    const donCuCon = urlParams.get('doncucon') || '0';
    const khachTra = urlParams.get('khachtra') || '0';
    const tongCong = urlParams.get('tongcong') || '0';
    const ngayBan = urlParams.get('ngayban') || '[Ngày bán]';
    const ghiChu = urlParams.get('ghichu') || '';
    const data = urlParams.get('data') || '';

    document.getElementById('pageTitle').textContent = decodeURIComponent(maDonHang);

    // Điền thông tin khách hàng
    const tenKhachValue = decodeURIComponent(tenKhach).trim();
    if (tenKhachValue) {
      document.getElementById('tenKhach').textContent = `Khách hàng: ${tenKhachValue}`;
    } else {
      document.getElementById('tenKhach').style.display = 'none';
    }

    document.getElementById('ngayBan').textContent = `Ngày bán: ${decodeURIComponent(ngayBan)}`;

    const ghiChuValue = decodeURIComponent(ghiChu).trim();
    if (ghiChuValue) {
      document.getElementById('ghiChu').textContent = `Ghi chú: ${ghiChuValue}`;
    } else {
      document.getElementById('ghiChu').style.display = 'none';
    }

    // ==================== XỬ LÝ BẢNG SẢN PHẨM ====================
    const table = document.getElementById('invoiceTable');
    let tongGia = 0;
    let hasAnyCK = false;

    if (data && data.trim() !== '') {
      const rowsData = decodeURIComponent(data).split('_b_');
      let detailRows = [];

      rowsData.forEach(record => {
        if (!record.trim()) return;
        const items = record.split('_a_');
        if (items.length < 4) return;

        const sanPham = items[0].replace(/_/g, ',').trim();
        const soLuong = items[1];

        let donGia, thanhTien, ckRaw;
        if (items.length >= 5) {
          ckRaw = items[2] || '0';
          donGia = parseInt(items[3].replace(/,/g, '')) || 0;
          thanhTien = parseInt(items[4].replace(/,/g, '')) || 0;
        } else {
          ckRaw = '0';
          donGia = parseInt(items[2].replace(/,/g, '')) || 0;
          thanhTien = parseInt(items[3].replace(/,/g, '')) || 0;
        }

        const ckPercent = parseFloat(ckRaw) * 100 || 0;
        if (ckPercent > 0) hasAnyCK = true;

        detailRows.push({ sanPham, soLuong, donGia, ckPercent, thanhTien });
        tongGia += thanhTien;
      });

      // Sắp xếp sản phẩm
      detailRows.sort((a, b) => a.sanPham.localeCompare(b.sanPham, 'vi'));

      detailRows.forEach(item => {
        const row = table.insertRow();
        row.insertCell(0).textContent = item.sanPham;
        row.insertCell(1).textContent = item.soLuong;
        row.insertCell(2).textContent = item.donGia.toLocaleString('vi-VN');
        const ckCell = row.insertCell(3);
        ckCell.textContent = (item.ckPercent > 0) ? item.ckPercent.toFixed(0) + '%' : '';
        row.insertCell(4).textContent = item.thanhTien.toLocaleString('vi-VN');
      });
    }

    // Ẩn cột CK nếu không có
    if (!hasAnyCK) {
      document.getElementById('ckHeader').style.display = 'none';
      const ckCells = table.querySelectorAll('td:nth-child(4)');
      ckCells.forEach(cell => cell.style.display = 'none');
    }

    // ==================== THÊM CÁC DÒNG TỔNG TIỀN ====================
    const colSpanValue = hasAnyCK ? 4 : 3;

    // Các hàm thêm dòng tổng (giữ nguyên logic cũ của bạn)
    // ... (phần này giữ nguyên như code cũ của bạn)

    // ==================== HÀM CHIA SẺ TỐI ƯU CHO iOS ====================
    async function captureInvoice() {
      return await html2canvas(document.getElementById("invoiceContent"), { 
        scale: 3, 
        useCORS: true,
        backgroundColor: '#ffffff'
      });
    }

    // Hàm chia sẻ chung (tối ưu cho iOS)
    async function shareFile(file, title = "Hóa đơn") {
      try {
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          await navigator.share({
            title: title,
            text: `Hóa đơn ${maDonHang}`,
            files: [file]
          });
          return;
        }
      } catch (e) {
        console.log("Web Share API lỗi → dùng fallback");
      }

      // Fallback: Tải file + hướng dẫn người dùng
      const url = URL.createObjectURL(file);
      const a = document.createElement('a');
      a.href = url;
      a.download = file.name;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      setTimeout(() => {
        alert(`✅ File ${file.name} đã được tải.\n\n` +
              `Để chia sẻ:\n` +
              `1. Kéo thanh địa chỉ Safari xuống\n` +
              `2. Nhấn vào file vừa tải\n` +
              `3. Bấm nút Chia sẻ → chọn app bạn muốn`);
      }, 600);

      setTimeout(() => URL.revokeObjectURL(url), 60000);
    }

    async function shareInvoice() {
      const canvas = await captureInvoice();
      const blob = await new Promise(r => canvas.toBlob(r, 'image/png'));
      const file = new File([blob], `hoa_don_${maDonHang}.png`, { type: 'image/png' });
      await shareFile(file, "Hóa đơn PNG");
    }

    async function shareInvoiceAsPdf() {
      const canvas = await captureInvoice();
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const imgWidth = 190;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      const pdf = new jsPDF({ 
        orientation: 'portrait', 
        unit: 'mm', 
        format: [210, Math.max(imgHeight + 30, 297)] 
      });
      pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
      
      const pdfBlob = pdf.output('blob');
      const pdfFile = new File([pdfBlob], `hoa_don_${maDonHang}.pdf`, { type: 'application/pdf' });
      await shareFile(pdfFile, "Hóa đơn PDF");
    }

    // ==================== GÁN SỰ KIỆN ====================
    document.getElementById("shareBtn").addEventListener("click", shareInvoice);
    document.getElementById("sharePdfBtn").addEventListener("click", shareInvoiceAsPdf);
    document.getElementById("savePdfBtn").addEventListener("click", async () => {
      const canvas = await captureInvoice();
      const imgData = canvas.toDataURL('image/png');
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF();
      const imgWidth = 190;
      const imgHeight = (canvas.height * imgWidth) / canvas.width;
      pdf.addImage(imgData, 'PNG', 10, 10, imgWidth, imgHeight);
      pdf.save(`hoa_don_${maDonHang}.pdf`);
    });
  </script>
</body>
</html>
